spring:
  application:
    name: jetvam-jobs
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${JETVAM_UAA_ISSUER:http://localhost:8081}
  threads:
    virtual:
      enabled: true
  jpa:
    open-in-view: false
  quartz:
    job-store-type: jdbc
    jdbc:
      initialize-schema: never
    overwrite-existing-jobs: false
    wait-for-jobs-to-complete-on-shutdown: true
    properties:
      org.quartz.scheduler.instanceName: jetvam-jobs
      org.quartz.scheduler.instanceId: AUTO
      org.quartz.jobStore.driverDelegateClass: org.quartz.impl.jdbcjobstore.PostgreSQLDelegate
      org.quartz.jobStore.tablePrefix: QRTZ_
      org.quartz.jobStore.isClustered: true
      org.quartz.jobStore.clusterCheckinInterval: 10000
      org.quartz.jobStore.useProperties: true
      org.quartz.threadPool.threadCount: ${JETVAM_JOBS_THREAD_COUNT:10}

server:
  port: ${JETVAM_JOBS_PORT:8082}
  shutdown: graceful

logging:
  structured:
    format:
      console: ${JETVAM_STRUCTURED_LOG_FORMAT:ir.jetvam.infra.observability.logging.OtelStructuredLogFormatter}
  level:
    jetvam.http.client: ${JETVAM_HTTP_LOG_LEVEL:INFO}
    jetvam.notification.delivery: ${JETVAM_NOTIFICATION_LOG_LEVEL:INFO}
    jetvam.repository: ${JETVAM_REPOSITORY_LOG_LEVEL:INFO}
    jetvam.audit: ${JETVAM_AUDIT_LOG_LEVEL:INFO}

management:
  tracing:
    sampling:
      probability: ${JETVAM_TRACING_SAMPLING_PROBABILITY:1.0}
    export:
      otlp:
        enabled: ${JETVAM_OTEL_TRACES_EXPORT_ENABLED:false}
  opentelemetry:
    enabled: ${JETVAM_OTEL_ENABLED:true}
    resource-attributes:
      service.name: ${spring.application.name}
      service.namespace: jetvam
      deployment.environment.name: ${JETVAM_ENVIRONMENT:local}

jetvam:
  security:
    resource-server:
      enabled: true
      public-paths: [/actuator/health/**, /actuator/info]
  observability:
    enabled: true
    logging:
      enabled: true
      level: ${JETVAM_OBSERVABILITY_EVENT_LEVEL:INFO}
    tracing:
      enabled: true
    metrics:
      enabled: true
    http:
      client:
        enabled: true
        logging-enabled: true
        metrics-enabled: true
    repository:
      enabled: true
      logging-enabled: true
      metrics-enabled: true
      tracing-enabled: true
      slow-threshold: ${JETVAM_REPOSITORY_SLOW_THRESHOLD:500ms}
    jdbc:
      enabled: true
      logging-enabled: true
      metrics-enabled: true
      tracing-enabled: true
      slow-threshold: ${JETVAM_JDBC_SLOW_THRESHOLD:500ms}
    audit:
      enabled: true
      metrics-enabled: true
      level: ${JETVAM_AUDIT_EVENT_LEVEL:INFO}
  persist:
    enabled: true
    url: ${JETVAM_DB_URL:jdbc:postgresql://localhost:5432/jetvam}
    username: ${JETVAM_DB_USERNAME:jetvam}
    password: ${JETVAM_DB_PASSWORD:jetvam}
    driver-class-name: org.postgresql.Driver
    default-schema: jetvam
    pool:
      name: jetvam-jobs-pool
      minimum-idle: ${JETVAM_JOBS_DB_POOL_MIN_SIZE:2}
      maximum-pool-size: ${JETVAM_JOBS_DB_POOL_MAX_SIZE:15}
      connection-timeout: 30s
      validation-timeout: 5s
      idle-timeout: 10m
      max-lifetime: 30m
    jpa:
      ddl-auto: validate
      show-sql: ${JETVAM_JPA_SHOW_SQL:false}
      format-sql: ${JETVAM_JPA_FORMAT_SQL:false}
      jdbc-time-zone: UTC
      jdbc-batch-size: 100
    migration:
      enabled: ${JETVAM_DB_MIGRATION_ENABLED:true}
      locations: classpath:db/migration
      validate-on-migrate: true
  cache:
    enabled: true
    provider: ${JETVAM_CACHE_PROVIDER:local}
    names: [i18n-messages]
    local:
      maximum-size: 5000
      expire-after-write: 10m
    redis:
      host: ${JETVAM_REDIS_HOST:localhost}
      port: ${JETVAM_REDIS_PORT:6379}
      username: ${JETVAM_REDIS_USERNAME:}
      password: ${JETVAM_REDIS_PASSWORD:}
      database: ${JETVAM_REDIS_DATABASE:0}
      ssl: ${JETVAM_REDIS_SSL:false}
      default-ttl: 10m
      key-prefix: "jetvam:jobs:"
  i18n:
    enabled: true
    default-locale: fa-IR
    cache-name: i18n-messages
  jobs:
    enabled: true
  http-client:
    connect-timeout: ${JETVAM_HTTP_CONNECT_TIMEOUT:3s}
    read-timeout: ${JETVAM_HTTP_READ_TIMEOUT:5s}
  notification:
    outbox:
      encryption-key-base64: ${JETVAM_NOTIFICATION_ENCRYPTION_KEY_BASE64:}
      max-attempts: ${JETVAM_NOTIFICATION_MAX_ATTEMPTS:5}
      initial-retry-delay: ${JETVAM_NOTIFICATION_INITIAL_RETRY_DELAY:2s}
      maximum-retry-delay: ${JETVAM_NOTIFICATION_MAX_RETRY_DELAY:1m}
      lease-duration: ${JETVAM_NOTIFICATION_LEASE_DURATION:30s}
    dispatcher:
      enabled: ${JETVAM_NOTIFICATION_DISPATCHER_ENABLED:false}
      fixed-delay: ${JETVAM_NOTIFICATION_POLL_DELAY:1s}
      batch-size: ${JETVAM_NOTIFICATION_BATCH_SIZE:25}
    observability:
      enabled: ${JETVAM_NOTIFICATION_OBSERVABILITY_ENABLED:true}
      logging-enabled: ${JETVAM_NOTIFICATION_LOGGING_ENABLED:true}
      metrics-enabled: ${JETVAM_NOTIFICATION_METRICS_ENABLED:true}
