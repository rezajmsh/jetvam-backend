spring:
  application:
    name: jetvam-jobs
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${JETVAM_UAA_ISSUER:http://localhost:8081}
  threads:
    virtual:
      enabled: true
  jpa:
    open-in-view: false
springdoc:
  enable-default-api-docs: false
  swagger-ui:
    path: /swagger-ui.html
    disable-swagger-default-url: true
  group-configs:
    - group: jobs
      display-name: Background jobs
      paths-to-match: [/api/v1/jobs/**]
    - group: integration
      display-name: External providers
      paths-to-match: [/api/v1/integrations/**]
    - group: inquiries
      display-name: Inquiry operations
      paths-to-match: [/api/v1/inquiries/**]

server:
  port: ${JETVAM_JOBS_PORT:8082}
  shutdown: graceful

logging:
  structured:
    format:
      console: ${JETVAM_STRUCTURED_LOG_FORMAT:ir.jetvam.infra.observability.logging.OtelStructuredLogFormatter}
  level:
    jetvam.http.client: ${JETVAM_HTTP_LOG_LEVEL:INFO}
    jetvam.notification.delivery: ${JETVAM_NOTIFICATION_LOG_LEVEL:INFO}
    jetvam.inquiry.worker: ${JETVAM_INQUIRY_LOG_LEVEL:INFO}
    jetvam.repository: ${JETVAM_REPOSITORY_LOG_LEVEL:INFO}
    jetvam.audit: ${JETVAM_AUDIT_LOG_LEVEL:INFO}
    org.hibernate.SQL: ${JETVAM_HIBERNATE_SQL_LOG_LEVEL:OFF}

management:
  otlp:
    metrics:
      export:
        enabled: false
  tracing:
    sampling:
      probability: ${JETVAM_TRACING_SAMPLING_PROBABILITY:1.0}
    export:
      otlp:
        enabled: false
  opentelemetry:
    enabled: ${JETVAM_OTEL_ENABLED:true}
    resource-attributes:
      service.name: ${spring.application.name}
      service.namespace: jetvam
      deployment.environment.name: ${JETVAM_ENVIRONMENT:local}

jetvam:
  otp:
    validation-enabled: false
  security:
    resource-server:
      enabled: true
  observability:
    enabled: true
    logging:
      enabled: true
      level: ${JETVAM_OBSERVABILITY_EVENT_LEVEL:INFO}
    tracing:
      enabled: true
    metrics:
      enabled: true
    http:
      client:
        enabled: true
        logging-enabled: true
        metrics-enabled: true
    repository:
      enabled: true
      logging-enabled: true
      log-successful-operations: ${JETVAM_REPOSITORY_LOG_SUCCESSES:true}
      metrics-enabled: true
      tracing-enabled: true
      slow-threshold: ${JETVAM_REPOSITORY_SLOW_THRESHOLD:500ms}
    jdbc:
      enabled: true
      logging-enabled: true
      log-successful-operations: ${JETVAM_JDBC_LOG_SUCCESSES:false}
      metrics-enabled: true
      tracing-enabled: true
      slow-threshold: ${JETVAM_JDBC_SLOW_THRESHOLD:500ms}
    audit:
      enabled: true
      metrics-enabled: true
      level: ${JETVAM_AUDIT_EVENT_LEVEL:INFO}
  persist:
    enabled: true
    url: ${JETVAM_DB_URL:jdbc:postgresql://localhost:5432/jetvam}
    username: ${JETVAM_DB_USERNAME:jetvam}
    password: ${JETVAM_DB_PASSWORD:jetvam}
    driver-class-name: org.postgresql.Driver
    default-schema: ${JETVAM_DB_SCHEMA:jetvam}
    pool:
      name: jetvam-jobs-pool
      minimum-idle: ${JETVAM_JOBS_DB_POOL_MIN_SIZE:2}
      maximum-pool-size: ${JETVAM_JOBS_DB_POOL_MAX_SIZE:15}
      connection-timeout: 30s
      validation-timeout: 5s
      idle-timeout: 10m
      max-lifetime: 30m
    jpa:
      ddl-auto: validate
      show-sql: ${JETVAM_JPA_SHOW_SQL:false}
      format-sql: ${JETVAM_JPA_FORMAT_SQL:false}
      jdbc-time-zone: UTC
      jdbc-batch-size: 100
    migration:
      enabled: ${JETVAM_DB_MIGRATION_ENABLED:true}
      locations: classpath:db/migration
      validate-on-migrate: true
      out-of-order: true
      ignore-migration-patterns: [ "*:missing" ]
  cache:
    enabled: true
    provider: ${JETVAM_CACHE_PROVIDER:local}
    names: [i18n-messages]
    local:
      maximum-size: 5000
      expire-after-write: 10m
    redis:
      host: ${JETVAM_REDIS_HOST:localhost}
      port: ${JETVAM_REDIS_PORT:6379}
      username: ${JETVAM_REDIS_USERNAME:}
      password: ${JETVAM_REDIS_PASSWORD:}
      database: ${JETVAM_REDIS_DATABASE:0}
      ssl: ${JETVAM_REDIS_SSL:false}
      default-ttl: 10m
      key-prefix: "jetvam:jobs:"
  i18n:
    enabled: true
    default-locale: fa-IR
    cache-name: i18n-messages
  jobs:
    enabled: true
    scheduler-thread-count: ${JETVAM_JOBS_SCHEDULER_THREAD_COUNT:2}
    execution-concurrency: ${JETVAM_JOBS_EXECUTION_CONCURRENCY:10}
    lock-duration: ${JETVAM_JOBS_LOCK_DURATION:1h}
    instance-id: ${JETVAM_JOBS_INSTANCE_ID:${spring.application.name}-${random.uuid}}
  inquiry:
    api:
      enabled: false
    worker:
      batch-size: ${JETVAM_INQUIRY_BATCH_SIZE:50}
  product:
    api:
      enabled: false
  assessment:
    api:
      enabled: false
  payment:
    api:
      enabled: false
  origination:
    api:
      enabled: false
  web:
    openapi:
      title: Jetvam Jobs API
      description: Background-job management and integration administration APIs
      version: v1
  http-client:
    connect-timeout: ${JETVAM_HTTP_CONNECT_TIMEOUT:3s}
    read-timeout: ${JETVAM_HTTP_READ_TIMEOUT:5s}
  notification:
    outbox:
      encryption-key-base64: ${JETVAM_NOTIFICATION_ENCRYPTION_KEY_BASE64:amV0dmFtLWxvY2FsLW5vdGlmaWNhdGlvbi1rZXktMDE=}
      max-attempts: ${JETVAM_NOTIFICATION_MAX_ATTEMPTS:5}
      initial-retry-delay: ${JETVAM_NOTIFICATION_INITIAL_RETRY_DELAY:2s}
      maximum-retry-delay: ${JETVAM_NOTIFICATION_MAX_RETRY_DELAY:1m}
      lease-duration: ${JETVAM_NOTIFICATION_LEASE_DURATION:30s}
    dispatcher:
      enabled: ${JETVAM_NOTIFICATION_DISPATCHER_ENABLED:false}
      fixed-delay: ${JETVAM_NOTIFICATION_POLL_DELAY:1s}
      batch-size: ${JETVAM_NOTIFICATION_BATCH_SIZE:25}
    observability:
      enabled: ${JETVAM_NOTIFICATION_OBSERVABILITY_ENABLED:true}
      logging-enabled: ${JETVAM_NOTIFICATION_LOGGING_ENABLED:true}
      metrics-enabled: ${JETVAM_NOTIFICATION_METRICS_ENABLED:true}
