spring:
  application:
    name: jetvam-uaa
  security:
    oauth2:
      authorizationserver:
        issuer: ${JETVAM_UAA_ISSUER:http://localhost:8081}
  threads:
    virtual:
      enabled: true
  jpa:
    open-in-view: false

server:
  port: ${JETVAM_UAA_PORT:8081}
  shutdown: graceful

logging:
  structured:
    format:
      console: ${JETVAM_STRUCTURED_LOG_FORMAT:ir.jetvam.infra.observability.logging.OtelStructuredLogFormatter}
  level:
    jetvam.http.server: ${JETVAM_HTTP_LOG_LEVEL:INFO}
    jetvam.http.client: ${JETVAM_HTTP_LOG_LEVEL:INFO}
    jetvam.notification.delivery: ${JETVAM_NOTIFICATION_LOG_LEVEL:INFO}
    jetvam.repository: ${JETVAM_REPOSITORY_LOG_LEVEL:INFO}
    jetvam.audit: ${JETVAM_AUDIT_LOG_LEVEL:INFO}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  tracing:
    sampling:
      probability: ${JETVAM_TRACING_SAMPLING_PROBABILITY:1.0}
    export:
      otlp:
        enabled: ${JETVAM_OTEL_TRACES_EXPORT_ENABLED:false}
  opentelemetry:
    enabled: ${JETVAM_OTEL_ENABLED:true}
    resource-attributes:
      service.name: ${spring.application.name}
      service.namespace: jetvam
      deployment.environment.name: ${JETVAM_ENVIRONMENT:local}

jetvam:
  security:
    resource-server:
      enabled: false
    authorization-server:
      enabled: true
  uaa:
    signing-key:
      key-store-location: ${JETVAM_JWT_KEYSTORE_LOCATION:}
      key-store-type: ${JETVAM_JWT_KEYSTORE_TYPE:PKCS12}
      key-store-password: ${JETVAM_JWT_KEYSTORE_PASSWORD:}
      key-alias: ${JETVAM_JWT_KEY_ALIAS:jetvam-uaa}
      key-password: ${JETVAM_JWT_KEY_PASSWORD:}
      allow-ephemeral: ${JETVAM_JWT_ALLOW_EPHEMERAL:true}
    bootstrap-admin:
      enabled: ${JETVAM_BOOTSTRAP_ADMIN_ENABLED:false}
      username: ${JETVAM_BOOTSTRAP_ADMIN_USERNAME:}
      mobile: ${JETVAM_BOOTSTRAP_ADMIN_MOBILE:}
      national-code: ${JETVAM_BOOTSTRAP_ADMIN_NATIONAL_CODE:}
      first-name: ${JETVAM_BOOTSTRAP_ADMIN_FIRST_NAME:}
      last-name: ${JETVAM_BOOTSTRAP_ADMIN_LAST_NAME:}
      password: ${JETVAM_BOOTSTRAP_ADMIN_PASSWORD:}
  identity:
    security:
      otp:
        code-length: ${JETVAM_OTP_CODE_LENGTH:6}
        time-to-live: ${JETVAM_OTP_TTL:2m}
        resend-interval: ${JETVAM_OTP_RESEND_INTERVAL:60s}
        rate-limit-window: ${JETVAM_OTP_RATE_LIMIT_WINDOW:1h}
        max-attempts: ${JETVAM_OTP_MAX_ATTEMPTS:5}
        max-challenges-per-window: ${JETVAM_OTP_MAX_CHALLENGES_PER_WINDOW:5}
        hmac-secret: ${JETVAM_OTP_HMAC_SECRET:}
  http-client:
    connect-timeout: ${JETVAM_HTTP_CONNECT_TIMEOUT:3s}
    read-timeout: ${JETVAM_HTTP_READ_TIMEOUT:5s}
  notification:
    outbox:
      encryption-key-base64: ${JETVAM_NOTIFICATION_ENCRYPTION_KEY_BASE64:}
      max-attempts: ${JETVAM_NOTIFICATION_MAX_ATTEMPTS:5}
      initial-retry-delay: ${JETVAM_NOTIFICATION_INITIAL_RETRY_DELAY:2s}
      maximum-retry-delay: ${JETVAM_NOTIFICATION_MAX_RETRY_DELAY:1m}
      lease-duration: ${JETVAM_NOTIFICATION_LEASE_DURATION:30s}
    dispatcher:
      enabled: ${JETVAM_NOTIFICATION_DISPATCHER_ENABLED:false}
      fixed-delay: ${JETVAM_NOTIFICATION_POLL_DELAY:1s}
      batch-size: ${JETVAM_NOTIFICATION_BATCH_SIZE:25}
    observability:
      enabled: ${JETVAM_NOTIFICATION_OBSERVABILITY_ENABLED:true}
      logging-enabled: ${JETVAM_NOTIFICATION_LOGGING_ENABLED:true}
      metrics-enabled: ${JETVAM_NOTIFICATION_METRICS_ENABLED:true}
  observability:
    enabled: true
    logging:
      enabled: true
      level: ${JETVAM_OBSERVABILITY_EVENT_LEVEL:INFO}
    tracing:
      enabled: true
    metrics:
      enabled: true
    http:
      server:
        enabled: true
        log-request: true
        log-response: true
        metrics-enabled: true
        include-query-string: false
        request-id-header: X-Request-Id
        excluded-paths: [/actuator/health, /actuator/prometheus]
      client:
        enabled: true
        logging-enabled: true
        metrics-enabled: true
    repository:
      enabled: true
      logging-enabled: true
      metrics-enabled: true
      tracing-enabled: true
      slow-threshold: ${JETVAM_REPOSITORY_SLOW_THRESHOLD:500ms}
    jdbc:
      enabled: true
      logging-enabled: true
      metrics-enabled: true
      tracing-enabled: true
      slow-threshold: ${JETVAM_JDBC_SLOW_THRESHOLD:500ms}
    audit:
      enabled: true
      metrics-enabled: true
      level: ${JETVAM_AUDIT_EVENT_LEVEL:INFO}
  web:
    response:
      envelope-enabled: true
      excluded-paths: [/actuator, /v3/api-docs, /swagger-ui]
    errors:
      include-details: true
  persist:
    enabled: true
    url: ${JETVAM_UAA_DB_URL:${JETVAM_DB_URL:jdbc:postgresql://localhost:5432/jetvam}}
    username: ${JETVAM_UAA_DB_USERNAME:${JETVAM_DB_USERNAME:jetvam}}
    password: ${JETVAM_UAA_DB_PASSWORD:${JETVAM_DB_PASSWORD:jetvam}}
    driver-class-name: org.postgresql.Driver
    default-schema: jetvam_identity
    pool:
      name: jetvam-uaa-pool
      minimum-idle: ${JETVAM_UAA_DB_POOL_MIN_SIZE:2}
      maximum-pool-size: ${JETVAM_UAA_DB_POOL_MAX_SIZE:15}
      connection-timeout: 30s
      validation-timeout: 5s
      idle-timeout: 10m
      max-lifetime: 30m
    jpa:
      ddl-auto: validate
      show-sql: ${JETVAM_JPA_SHOW_SQL:false}
      format-sql: ${JETVAM_JPA_FORMAT_SQL:false}
      jdbc-time-zone: UTC
      jdbc-batch-size: 30
    migration:
      enabled: true
      locations: classpath:db/migration
      validate-on-migrate: true
  cache:
    enabled: true
    provider: ${JETVAM_CACHE_PROVIDER:local}
    names: [i18n-messages]
    local:
      maximum-size: 5000
      expire-after-write: 10m
    redis:
      host: ${JETVAM_REDIS_HOST:localhost}
      port: ${JETVAM_REDIS_PORT:6379}
      username: ${JETVAM_REDIS_USERNAME:}
      password: ${JETVAM_REDIS_PASSWORD:}
      database: ${JETVAM_REDIS_DATABASE:0}
      ssl: ${JETVAM_REDIS_SSL:false}
      default-ttl: 10m
      key-prefix: "jetvam:uaa:"
  i18n:
    enabled: true
    default-locale: fa-IR
    cache-name: i18n-messages
